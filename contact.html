<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header class="inner-header">
            <a href="./index.html" class="logo">Savannah</a>
            <a href="./index.html" class="back-home">← Back Home</a>
        </header>

        <main>
            <h1 class="page-title">Let's Connect</h1>
            
            <!-- Standard form shell. Hook up to a backend handler or service like Formspree when deploying -->
            <form action="https://formsubmit.co/savsumners@gmail.com" method="POST">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required placeholder="Your Name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="name@company.com">
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" required placeholder="Outline your project scope or timeline constraints..."></textarea>
                </div>

                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </main>
    </div>

    <footer class="minimal-footer">
        <p>&copy; 2026 Your Name.</p>
    </footer>

</body>
</html>
